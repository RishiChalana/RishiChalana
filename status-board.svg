<svg width="900" height="430" viewBox="0 0 900 430" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <style>
    text { fill:#E6EDF3; }
    .muted { fill:#7C8795; }
    .grn { fill:#35D0A5; } .blu { fill:#5B93FF; } .amb { fill:#F2B84B; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .gauge { stroke-dasharray:377; stroke-dashoffset:377; animation: fill 1.7s .35s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
    @keyframes fill  { to { stroke-dashoffset:7.5; } }
    @media (prefers-reduced-motion: reduce){
      .pulse,.blink,.gauge{ animation:none; } .gauge{ stroke-dashoffset:7.5; }
    }
  </style>

  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#1A212B" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect width="900" height="430" rx="16" fill="#0B0E13"/>
  <rect x="1" y="1" width="898" height="428" rx="15" fill="#10141A" stroke="#232B35"/>
  <rect x="1" y="1" width="898" height="428" rx="15" fill="url(#grid)" opacity="0.35"/>

  <!-- title bar -->
  <circle cx="40" cy="46" r="6" fill="none" stroke="#35D0A5" opacity="0.5">
    <animate attributeName="r" values="6;17" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle class="pulse" cx="40" cy="46" r="6" fill="#35D0A5"/>
  <text x="58" y="54" font-size="26" font-weight="700" letter-spacing="1">rishi.chalana</text>
  <text x="866" y="40" text-anchor="end" font-size="11" letter-spacing="2" class="muted">SYS.STATUS</text>
  <text x="866" y="57" text-anchor="end" font-size="14" font-weight="700" class="grn">● ONLINE</text>
  <text x="58" y="80" font-size="12" letter-spacing="2" class="muted">CS · VIT VELLORE '27 · REAL-TIME AI · ML SECURITY</text>

  <line x1="24" y1="100" x2="876" y2="100" stroke="#232B35"/>

  <!-- SERVICES -->
  <text x="34" y="132" font-size="11" letter-spacing="3" class="muted">SERVICES / 4 ACTIVE</text>

  <!-- echoroom -->
  <circle class="pulse" cx="40" cy="163" r="4.5" fill="#35D0A5"/>
  <text x="56" y="168" font-size="15">echoroom</text>
  <text x="520" y="168" text-anchor="end" font-size="12" letter-spacing="1" class="grn">● LIVE</text>

  <!-- sentinel -->
  <circle class="pulse" cx="40" cy="203" r="4.5" fill="#5B93FF"/>
  <text x="56" y="208" font-size="15">sentinel</text>
  <text x="520" y="208" text-anchor="end" font-size="12" letter-spacing="1" class="blu">● MONITORING</text>

  <!-- astrofoundation (spinner) -->
  <circle cx="40" cy="243" r="5.5" fill="none" stroke="#F2B84B" stroke-width="2" stroke-dasharray="20 100" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 40 243" to="360 40 243" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="248" font-size="15">astrofoundation</text>
  <text x="520" y="248" text-anchor="end" font-size="12" letter-spacing="1" class="amb">◐ TRAINING</text>

  <!-- helm -->
  <circle class="pulse" cx="40" cy="283" r="4.5" fill="#35D0A5"/>
  <text x="56" y="288" font-size="15">helm</text>
  <text x="520" y="288" text-anchor="end" font-size="12" letter-spacing="1" class="grn">● LIVE</text>

  <!-- right column: integrity gauge -->
  <line x1="556" y1="118" x2="556" y2="344" stroke="#232B35"/>
  <text x="716" y="138" text-anchor="middle" font-size="11" letter-spacing="3" class="muted">INTEGRITY SCORE</text>
  <circle cx="716" cy="232" r="60" stroke="#1E2630" stroke-width="12" fill="none"/>
  <circle class="gauge" cx="716" cy="232" r="60" stroke="#35D0A5" stroke-width="12" fill="none" stroke-linecap="round" transform="rotate(-90 716 232)"/>
  <text x="716" y="240" text-anchor="middle" font-size="30" font-weight="700" class="grn">0.98</text>
  <text x="716" y="320" text-anchor="middle" font-size="10" letter-spacing="2" class="muted">SENTINEL · RUNTIME</text>

  <!-- log -->
  <line x1="24" y1="356" x2="876" y2="356" stroke="#232B35"/>
  <text x="34" y="384" font-size="12" class="muted">&gt; tail -f ~/rishi.log</text>
  <text x="34" y="408" font-size="12">
    <tspan class="grn">[LIVE]</tspan> shipping production AI<tspan class="muted">  ·  </tspan><tspan class="blu">[OK]</tspan> 140+ tests green<tspan class="muted">  ·  </tspan><tspan class="amb">[BUSY]</tspan> hunting the next hard bug<tspan class="blink" dx="6">▊</tspan>
  </text>
</svg>
